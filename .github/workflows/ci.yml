name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you also start it by hand from the Actions tab

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: Install dependencies
        run: pip install -r requirements-serve.txt pytest
      - name: Run tests (tests that need the dataset or the model skip themselves)
        run: python -m pytest -q -rs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t fraudshield-api .